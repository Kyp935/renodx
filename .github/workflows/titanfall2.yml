name: titanfall2

on:
  workflow_dispatch:
  push:
    branches: [titanfall2]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64

      # The devkit and MCP bridge are built from the same commit so cross-addon shared state matches the mod.
      - name: Build titanfall2, devkit and MCP bridge (x64)
        run: cmake --build --preset clang-x64-release --target titanfall2 devkit mcp_bridge --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: renodx-titanfall2
          path: |
            build/release/renodx-titanfall2.addon64
            build/release/renodx-devkit.addon64
            build/release/renodx-mcp-bridge.exe

      - name: Publish release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: titanfall2-snapshot
          prerelease: true
          title: RenoDX Titanfall 2 Snapshot
          files: |
            build/release/renodx-titanfall2.addon64
            build/release/renodx-devkit.addon64
            build/release/renodx-mcp-bridge.exe
